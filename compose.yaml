# Speakrail: a full-duplex voice assistant on one 24 GB NVIDIA GPU.
#
#   cp .env.example .env
#   docker compose up -d                      # first start downloads ~22 GB of models
#   docker compose --profile search up -d     # with local web search (SearXNG)
#
# Then open http://localhost:8080 (UI_HOST / UI_PORT in .env).
#
# The images are pulled from Docker Hub (speakrail/*). To build everything from source instead:
#   docker compose up -d --build                # ASR_CUDA_ARCHS in .env picks the GPU generations for the ASR build

name: speakrail

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${CUDA_VISIBLE_DEVICES:-0}"]
            capabilities: [gpu]

x-models-ro: &models-ro
  - ${MODELS_DIR:-./models}:/models:ro

services:
  # downloads and patches the models, then exits; the GPU services wait for it
  model-init:
    image: docker.io/speakrail/model-init:${SPEAKRAIL_VERSION:-0.1.0}
    build: deploy/model-init
    volumes:
      - ${MODELS_DIR:-./models}:/models
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    restart: "no"

  # Voxtral Mini 4B Realtime (audio.cpp, q8_0) + the turn head, behind the bridge
  asr:
    image: docker.io/speakrail/voxtral-stt-server:${SPEAKRAIL_VERSION:-0.1.0}
    build:
      context: engines/asr/audiocpp
      args:
        CUDA_ARCHS: ${ASR_CUDA_ARCHS:-75-real;80-real;80-virtual;86-real;89-real;90-real;100-real;120a-real;121a-real}
    <<: *gpu
    volumes: *models-ro
    environment:
      ASR_HOST: 0.0.0.0
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Breeze TTS 2 (research and non-commercial use only)
  tts:
    image: docker.io/speakrail/breeze-tts-server:${SPEAKRAIL_VERSION:-0.1.0}
    build: engines/tts/breeze-docker
    <<: *gpu
    volumes: *models-ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Gemma 4 12B QAT int4 + the speakrail LoRA; starts after ASR and TTS hold their GPU memory
  llm:
    image: docker.io/vllm/vllm-openai:v0.26.0
    <<: *gpu
    volumes: *models-ro
    ipc: host
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      HF_HUB_OFFLINE: "1"
    entrypoint: ["vllm", "serve"]
    command:
      - /models/speakrail-gemma/model
      - --served-model-name=speakrail-base
      - --host=0.0.0.0
      - --port=8000
      - --enable-lora
      - --max-lora-rank=32
      - --max-loras=1
      - --lora-modules=speakrail=/models/speakrail-gemma/adapter
      - --max-model-len=${LLM_MAX_MODEL_LEN:-16384}
      - --max-num-seqs=3
      - --gpu-memory-utilization=${LLM_GPU_MEMORY_UTILIZATION:-0.48}
      - --enable-prefix-caching
      - --generation-config=vllm
      - '--limit-mm-per-prompt={"image":0,"audio":0}'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 600s
    depends_on:
      asr:
        condition: service_healthy
      tts:
        condition: service_healthy
    restart: unless-stopped

  # the harness and the web UI
  app:
    image: docker.io/speakrail/app:${SPEAKRAIL_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    ports:
      - ${UI_HOST:-127.0.0.1}:${UI_PORT:-8080}:8080
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - app-data:/data
    environment:
      ASR_URL: ws://asr:8765/v1/transcribe
      LLM_URL: http://llm:8000/v1/completions
      TTS_URL: http://tts:7860/v1/audio/speech
      SEARXNG_URL: http://searxng:8080/search
      VOICE: ${VOICE:-female_a.wav}
      PERSONA: ${PERSONA:-nova}
      HOME_CITY: ${HOME_CITY:-London}
      HOME_TIMEZONE: ${HOME_TIMEZONE:-Europe/London}
      SILENCE_MS: ${SILENCE_MS:-1000}
      NOTES: ${NOTES:-1}
      INTERJECT: ${INTERJECT:-1}
      SEARCH: ${SEARCH:-off}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      SESSIONS_DIR: ${SESSIONS_DIR:-}
    depends_on:
      llm:
        condition: service_healthy
    restart: unless-stopped

  # optional local web search: docker compose --profile search up -d (and SEARCH=searxng)
  searxng:
    image: docker.io/searxng/searxng:2026.9.19-e831fc2a1
    profiles: [search]
    volumes:
      - ./deploy/search/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    restart: unless-stopped

volumes:
  app-data:
