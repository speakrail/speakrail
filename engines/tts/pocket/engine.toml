contract = 1
role = "tts"
name = "pocket"
description = "Kyutai Pocket TTS on audio.cpp, on the CPU"
capabilities = ["stream", "cancel", "clone"]
platforms = ["darwin"]         # also fine on Linux; its entry arrives with the Linux engines
url = "http://127.0.0.1:${port_main}/v1/audio/speech"
startup_timeout_s = 60

[ports]
main = 8091

[params]
audiocpp_dir = "${home}/bin/audiocpp"
gguf = "${models}/pocket/english/pocket-tts-english-q8_0.gguf"
threads = "4"
default_voice = "alba"

[harness]
worker = "pocket"
model = "pocket-tts"

[[file]]
name = "audiocpp.json"
template = "audiocpp.json.in"

[[process]]
name = "audiocpp"
cmd = ["${audiocpp_dir}/audiocpp_server", "--config", "${run}/audiocpp.json"]
cwd = "${audiocpp_dir}"
health = "http://127.0.0.1:${port_main}/health"
