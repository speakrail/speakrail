# The reference LLM engine: no model and no GPU. Copy this folder to start a new engine.
contract = 1
role = "llm"
name = "stub"
description = "Scripted answers that follow the LLM contract, for tests and as a template"
capabilities = ["chat", "parallel", "per_request_adapter", "cancel", "prefix_cache", "sampling"]
platforms = ["darwin", "linux"]
url = "http://127.0.0.1:${port_main}/v1/completions"
startup_timeout_s = 20

[ports]
main = 18000

[params]
flags = ""

[[process]]
name = "server"
cmd = ["${python}", "-u", "${engine_dir}/server.py", "--port", "${port_main}", "--flags", "${flags}"]
health = "http://127.0.0.1:${port_main}/health"
