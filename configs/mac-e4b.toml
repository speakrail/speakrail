name = "mac-e4b"
status = "tested"
description = "Gemma E4B on MLX, Voxtral q4, Pocket on the CPU"
platform = "apple"
priority = 10
memory_peak_gib = 10.7    # all processes, measured with notes off. Notes on long turns added about 1 GiB.
disk_gib = 12.5

[engines]
asr = "asr/audiocpp"
tts = "tts/pocket"
llm = "llm/mlx"

[harness]
tokenizer_dir = "${models}/speakrail-e4b-adapter/tokenizer"
voice = "jane"           # one of Pocket's built-in voices
llm_lora = "speakrail"
llm_base_model = "speakrail-base"
turn_k = 1                # all_ant80 was benchmarked at K=1
spec = true               # better p90, and affordable on MLX
ant4 = ""                 # delays the endpoint here, and made one recording ignore "stop"
peek_frames = 8           # 10 cost 110 ms to the ear with no gain at endpoints
notes = false             # +164 ms on long turns, and no measured benefit on E4B
tool_hold_ms = 300

[run]
phrase_cache = true

# What the installer fetches: files from a repo at an exact commit, into a folder under the models directory.
[[download]]
repo = "speakrail/speakrail-voxtral-realtime-2602-turnhead-2611"    # the all_ant80 head
revision = "f0cfe64e4941c95d3cac650bd7773ea0f75b284c"
include = ["turn_head.vxth", "turn_head.vxth.json"]
to = "turn_head"

[[download]]
repo = "audio-cpp/audio.cpp-gguf"
revision = "fd2fe4c3195bc410f8b817bf7c7519fd822686fb"
from = "Voxtral-Mini-4B-Realtime-2602-GGUF"
include = ["voxtral-mini-4b-realtime-2602-q4_k.gguf"]
to = "voxtral"

[[download]]
repo = "audio-cpp/audio.cpp-gguf"
revision = "661a224e9d9adbd49c01626f85e426f5f425d771"               # the model file has changed since; this is the one measured
from = "PocketTTS-GGUF/english"
include = ["pocket-tts-english-q8_0.gguf", "embeddings/jane.safetensors"]
to = "pocket/english"

[[download]]
repo = "speakrail/gemma-4-E4B-it-qat-Speakrail-181026"
revision = "41d5549664bd1422f679bb32c3e83ebee9b896ee"
include = ["tokenizer/*"]
to = "speakrail-e4b-adapter"

[[download]]
repo = "speakrail/gemma-4-E4B-it-qat-Speakrail-181026"
revision = "76dc42d319355d3dac111d419d6e466a016d599b"
from = "mlx/model"
include = ["*"]
to = "speakrail-e4b-mlx"

[[download]]
repo = "speakrail/gemma-4-E4B-it-qat-Speakrail-181026"
revision = "76dc42d319355d3dac111d419d6e466a016d599b"
from = "mlx/adapter"
include = ["*"]
to = "speakrail-e4b-adapter-mlx"

[evidence]
machine = "Apple M4 Pro, 24 GB"
date = "2026-11-06"
tapes = "12 latest recordings, replayed through `speakrail run` with no settings chosen by hand"
last_word_to_ear_ms = "954/1351"
