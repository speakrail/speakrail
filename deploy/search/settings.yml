# SearXNG for the optional web_search tool (docker compose --profile search up). The secret comes from SEARXNG_SECRET.
# JSON output is needed by the harness; the limiter is off because the only client is the harness itself.
use_default_settings: true
server:
  limiter: false
  image_proxy: false
search:
  formats: [html, json]
  default_lang: en
  safe_search: 0
outgoing:
  request_timeout: 2.0
  max_request_timeout: 3.0
  # search engines often answer a burst of queries with a captcha; retry them after minutes, not a day
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 120
